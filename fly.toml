# fly.toml — ProfessionalRAG query/chat API
#
# Deploys the root Dockerfile (uvicorn api.server:app on :8080). This serves a
# low-traffic personal portfolio chat widget (/query and /chat), so the machine
# scales to zero when idle and resumes from a memory snapshot ("suspend") on the
# next request — sub-second resume, ~$0 while idle, versus ~$3.32/mo for an
# always-on machine. Secrets are set out-of-band with `fly secrets set` (never in
# this file). The S3-triggered ingest Lambda is not used here: populate Pinecone
# once with `python cli.py ingest <docs>`; this service only serves /query and /chat.
#
# Want zero resume latency instead (always-on, ~$3.32/mo)? Set
# auto_stop_machines = "off" and min_machines_running = 1.

app            = "professionalrag"
primary_region = "iad"             # us-east-1 area — near Pinecone & the AWS analytics table

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port       = 8080
  force_https         = true
  # Scale to zero when idle; suspend keeps a memory snapshot so resume is
  # sub-second (much faster than a cold "stop"). min 0 = pay only while serving.
  auto_stop_machines   = "suspend"
  auto_start_machines  = true
  min_machines_running = 0

  [[http_service.checks]]
    method   = "get"
    path     = "/health"           # auth-exempt in the app's middleware
    interval = "30s"
    timeout  = "5s"
    grace_period = "15s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"                 # lean runtime (no torch); 512MB gives safe headroom
