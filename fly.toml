# fly.toml — ProfessionalRAG query/chat API
#
# Deploys the root Dockerfile (uvicorn api.server:app on :8080) as a single
# always-on machine so the first request is instant — no cold start. Secrets are
# set out-of-band with `fly secrets set` (never in this file). The S3-triggered
# ingest Lambda is not used here: populate Pinecone once with `python cli.py
# ingest <docs>`; this service only serves /query and /chat.
#
# `fly launch` may rename the app if "professionalrag" is taken globally.

app            = "professionalrag"
primary_region = "iad"             # us-east-1 area — near Pinecone & the AWS analytics table

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false      # always-on: the whole point is "feels instant"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method   = "get"
    path     = "/health"           # auth-exempt in the app's middleware
    interval = "30s"
    timeout  = "5s"
    grace_period = "15s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
