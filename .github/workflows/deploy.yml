name: Deploy

# Deploy the query/chat API to Fly.io on every push to main.
# The image is built on Fly's remote builder (--remote-only), so the runner only
# needs flyctl + a deploy token. Runtime secrets live in `fly secrets`, never here.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
